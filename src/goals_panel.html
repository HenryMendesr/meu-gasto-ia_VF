<section class="goals-section" aria-labelledby="goalsTitle"><div class="section-title goals-title"><div><span class="eyebrow">O próximo capítulo</span><h3 id="goalsTitle">Suas metas, um passo de cada vez.</h3><p class="quiet">Defina um destino para o dinheiro que está construindo.</p></div><button id="newGoal" type="button" class="secondary">＋ Nova meta</button></div><div id="goalStatus" class="message" hidden></div><div id="goalList" class="goal-list"></div></section>
<div id="goalModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="goalModalTitle" hidden><section class="modal-card compact-modal"><div class="modal-head"><h2 id="goalModalTitle">Nova meta</h2><button id="closeGoalModal" class="icon-button" type="button" aria-label="Fechar">×</button></div><form id="goalForm" class="entry-grid"><input name="id" type="hidden"><label class="wide">O que você quer conquistar?<input name="name" maxlength="80" placeholder="Ex.: Reserva de emergência" required></label><label>Valor da meta (R$)<input name="target_amount" type="text" inputmode="decimal" data-goal-money placeholder="0,00" maxlength="18" required></label><label>Já reservado (R$)<input name="current_amount" type="text" inputmode="decimal" data-goal-money placeholder="0,00" maxlength="18" required></label><label class="wide">Até quando?<input name="target_date" type="date" min="1900-01-01" required></label><p class="wide quote-meta">O acompanhamento é manual. Informe o total já reservado, não apenas o último aporte. A meta não retira dinheiro do caixa nem altera seus investimentos.</p><div id="goalFormMessage" class="message error" hidden></div><button type="submit" class="save">Salvar meta</button></form></section></div>
