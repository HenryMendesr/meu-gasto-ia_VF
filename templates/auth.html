<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b4a"><link rel="icon" href="/icons/icon-192.png"><title>__TITLE__ — Meu Gasto IA</title><style>:root{--red:#a61f24;--ink:#17202a;--muted:#687281;--line:#e5e8ec;--yellow:#fff3bf}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f4f6f8;color:var(--ink);font:15px/1.45 Inter,Arial,sans-serif}.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 16px 48px rgba(31,38,46,.12)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}.brand img{width:54px;height:54px;border-radius:15px}.brand h1{margin:0;font-size:23px}.sub{color:var(--muted);font-size:13px}form{display:grid;gap:15px}label{display:grid;gap:7px;font-size:12px;font-weight:750;color:var(--muted)}input{width:100%;background:var(--yellow);border:1px solid #e5d68f;border-radius:11px;padding:13px;font:inherit}button{border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:800;padding:13px;cursor:pointer}.error{background:#fde8e8;color:var(--red);padding:11px;border-radius:10px;font-weight:700;font-size:13px}.security{margin-top:18px;color:var(--muted);font-size:11px;text-align:center}</style><link rel="stylesheet" href="/app.css"></head><body><main class="card"><div class="brand"><img src="/icons/icon-192.png" alt=""><div><h1>Meu Gasto IA</h1><div class="sub">__SUBTITLE__</div></div></div>__ERROR__<form method="post" action="__ACTION__">__FIELDS__<button type="submit">__BUTTON__</button></form><div class="auth-links">__FOOTER__</div><div class="security">Sua senha é protegida e seus dados ficam separados dos demais usuários.</div></main></body></html>
